name: Backend CI — Type Check & Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'ecommerce-BE/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ecommerce-BE/**'

defaults:
  run:
    working-directory: ecommerce-BE

jobs:
  ci:
    name: Type Check & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ecommerce-BE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check (NestJS)
        run: npx tsc --noEmit

      - name: Build NestJS
        run: npm run build

      - name: Verify dist output
        run: test -f dist/src/main.js && echo "✅ NestJS build OK" || (echo "❌ dist/src/main.js missing" && exit 1)
